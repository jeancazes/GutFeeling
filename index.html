<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gut Feeling — Essai technique</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#0f1720; --card:#16212e; --accent:#34d399; --txt:#e6edf3; --muted:#8b9bb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); min-height:100vh; display:flex;
         flex-direction:column; align-items:center; padding:18px; }
  h1 { font-size:1.4rem; margin:6px 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; text-align:center; }

  /* Cadre d'attente */
  .frame { background:var(--card); border:2px dashed #2f4256; border-radius:18px;
           padding:30px 22px; max-width:440px; width:100%; text-align:center; }
  .frame-icon { font-size:2.6rem; }
  .frame-title { font-size:1.3rem; font-weight:700; margin:12px 0 6px; }
  .frame-sub { color:var(--muted); font-size:.9rem; line-height:1.5; margin-bottom:16px; }

  /* Aperçu caméra : masqué par défaut SANS arrêter le scan */
  #reader { width:100%; max-width:340px; margin:14px auto 0; border-radius:14px; overflow:hidden; }
  #reader.collapsed { height:1px; width:1px; opacity:0; margin:0; pointer-events:none; }
  .status { font-size:.82rem; color:var(--muted); margin-top:12px; min-height:1.1em; }

  /* Carte détectée */
  .card { background:var(--card); border-radius:18px; padding:20px; max-width:440px;
          width:100%; box-shadow:0 8px 30px rgba(0,0,0,.4); text-align:center; }
  .illus { width:100%; max-width:260px; margin:0 auto 8px; }
  .card h2 { margin:6px 0 4px; color:var(--accent); font-size:1.3rem; }
  .card .latin { font-style:italic; color:var(--muted); margin-bottom:16px; }
  .card p { line-height:1.55; margin:14px 0 4px; text-align:left;
            background:#0f1925; border-radius:10px; padding:14px; }

  button { background:var(--accent); color:#04231a; border:none; border-radius:12px;
           padding:16px 18px; font-size:1.05rem; font-weight:700; cursor:pointer;
           width:100%; min-height:54px; margin-top:10px; }
  button.secondary { background:#26384a; color:var(--txt); font-weight:600; }
  .hidden { display:none; }
  .speaking { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
</style>
</head>
<body>
  <h1>🧫 Gut Feeling</h1>
  <div class="sub" id="sub">Essai technique — extrait sonore en anglais</div>

  <!-- Cadre d'attente. La caméra scanne en continu ; l'aperçu est masqué par défaut. -->
  <div id="home" class="frame">
    <div class="frame-icon">🃏</div>
    <div class="frame-title">Présentez une carte</div>
    <div class="frame-sub">La caméra scanne en continu. Présentez le QR code au dos d'une carte.</div>
    <button id="previewToggle" class="secondary">👁 Voir la caméra</button>
    <div id="reader" class="collapsed"></div>
    <div id="status" class="status"></div>
  </div>

  <!-- Carte détectée : illustration + son + texte masqué -->
  <div id="result" class="card hidden">
    <div class="illus" id="illus"></div>
    <h2 id="title"></h2>
    <div class="latin" id="latin"></div>
    <button id="playBtn">🔊 Écouter l'extrait (anglais)</button>
    <button id="stopBtn" class="secondary hidden">⏹ Arrêter</button>
    <button id="textToggle" class="secondary">📄 Voir le texte</button>
    <p id="text" class="hidden"></p>
    <button id="rescanBtn" class="secondary">↩ Retour</button>
  </div>

<script>
// --- Illustration SVG (E. coli) intégrée ---
const SVG_ECOLI = `
<svg viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5ee9b0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#0f1720" stop-opacity="0"/></linearGradient></defs>
  <g fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M40 80 Q22 64 8 72 Q22 80 10 96"/>
    <path d="M44 96 Q26 110 12 104 Q28 100 18 118"/>
    <path d="M52 60 Q40 44 28 46 Q42 52 34 38"/>
    <path d="M214 70 Q236 56 250 66 Q234 70 248 84"/>
    <path d="M210 92 Q232 104 246 96 Q230 96 242 112"/>
  </g>
  <rect x="56" y="50" width="148" height="60" rx="30" fill="#1f3a2e" stroke="#34d399" stroke-width="3"/>
  <rect x="56" y="50" width="148" height="60" rx="30" fill="url(#g)"/>
  <circle cx="92" cy="76" r="6" fill="#9af5cf"/>
  <circle cx="120" cy="90" r="4.5" fill="#9af5cf"/>
  <circle cx="150" cy="72" r="5.5" fill="#9af5cf"/>
  <circle cx="172" cy="88" r="4" fill="#9af5cf"/>
  <path d="M104 64 q14 8 30 -2" stroke="#cffae8" stroke-width="2" fill="none" opacity="0.6"/>
</svg>`;

// --- Base de données des cartes (extensible) ---
const CARDS = {
  "ecoli": {
    title: "Escherichia coli",
    latin: "E. coli — gut bacterium",
    lang: "en-US",
    illus: SVG_ECOLI,
    audio: "Escherichia coli, commonly known as E. coli, is a bacterium that lives in " +
           "the intestines of humans and animals. Most strains are harmless and actually " +
           "help us by producing vitamin K and protecting the gut from harmful microbes. " +
           "However, some strains can cause food poisoning, with symptoms like stomach " +
           "cramps, diarrhea, and fever. E. coli is also one of the most studied organisms " +
           "in biology, helping scientists understand how cells work."
  }
};

const $ = id => document.getElementById(id);
let currentCard = null, qr = null, scanning = false;

function resolveCard(text) {
  let t = (text || "").trim().toLowerCase();
  try { if (t.startsWith("http")) t = new URL(text).searchParams.get("card") || t; } catch(e){}
  if (t.includes(":")) t = t.split(":").pop();
  return CARDS[t] || null;
}

// ---- Carte ----
function showCard(card) {
  currentCard = card;
  stopScanner();
  $("home").classList.add("hidden");
  $("illus").innerHTML = card.illus || "";
  $("title").textContent = card.title;
  $("latin").textContent = card.latin;
  $("text").textContent = card.audio;
  $("text").classList.add("hidden");
  $("textToggle").textContent = "📄 Voir le texte";
  $("result").classList.remove("hidden");
  speak(card); // lecture auto (bloquée sur iPhone -> bouton dispo)
}

function speak(card) {
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(card.audio);
  u.lang = card.lang; u.rate = 0.95;
  const en = synth.getVoices().find(v => v.lang && v.lang.startsWith("en"));
  if (en) u.voice = en;
  u.onstart = () => { $("playBtn").classList.add("speaking"); $("stopBtn").classList.remove("hidden"); };
  u.onend   = () => { $("playBtn").classList.remove("speaking"); $("stopBtn").classList.add("hidden"); };
  synth.speak(u);
}

$("playBtn").onclick = () => { if (currentCard) speak(currentCard); };
$("stopBtn").onclick = () => window.speechSynthesis.cancel();
$("textToggle").onclick = () => {
  const hidden = $("text").classList.toggle("hidden");
  $("textToggle").textContent = hidden ? "📄 Voir le texte" : "🙈 Masquer le texte";
};
$("rescanBtn").onclick = () => {
  window.speechSynthesis.cancel();
  $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  startScanner(); // relance le scan en continu, aperçu masqué
};

// ---- Caméra : toujours en scan, aperçu seulement masqué/affiché ----
function startScanner() {
  if (scanning) return;
  scanning = true;
  qr = new Html5Qrcode("reader");
  // "user" = caméra côté écran (frontale). "environment" = caméra arrière.
  qr.start({ facingMode: "user" },
           { fps: 10, qrbox: { width: 230, height: 230 } },
           onScanSuccess)
    .then(() => { $("status").textContent = "Caméra active — en attente d'une carte…"; })
    .catch(() => {
      scanning = false;
      $("status").innerHTML = "Caméra indisponible (HTTPS + autorisation requis).<br>" +
        "Astuce : scannez le QR avec l'appareil photo du téléphone.";
    });
}
function stopScanner() {
  if (qr && scanning) { try { qr.stop(); } catch(e){} }
  scanning = false;
}
function onScanSuccess(text) {
  const card = resolveCard(text);
  if (!card) { $("status").textContent = "QR non reconnu : " + text; return; }
  showCard(card);
}

// Le bouton ne fait QU'afficher/masquer l'aperçu — le scan continue.
$("previewToggle").onclick = () => {
  const hidden = $("reader").classList.toggle("collapsed");
  $("previewToggle").textContent = hidden ? "👁 Voir la caméra" : "🙈 Masquer la caméra";
};

// ---- Ouverture via URL (?card=ecoli) : appareil photo natif ----
window.addEventListener("load", () => {
  const param = new URLSearchParams(location.search).get("card");
  const card = param ? CARDS[param.toLowerCase()] : null;
  if (card) { $("sub").textContent = "Appuyez sur le bouton pour écouter l'extrait."; showCard(card); }
  else { startScanner(); } // caméra active dès le départ, aperçu masqué
});
</script>
</body>
</html>
